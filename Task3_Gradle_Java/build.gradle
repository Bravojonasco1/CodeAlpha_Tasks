plugins {
    id 'java'
    id 'application'
}

group = 'com.codealpha'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'com.codealpha.App'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.codealpha.App'
        )
    }
}

test {
    useJUnitPlatform()
}
